name: Validate portfolio V4

on:
  push:
    branches: ["portfolio-v4", "v4-*", "main"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm run test
      - name: Build
        run: npm run build

# Publicação propositalmente não automatizada antes da aprovação da V4.
